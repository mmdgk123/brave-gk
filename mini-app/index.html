<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>جستجو</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Vazirmatn,Tahoma,sans-serif;background:var(--tg-theme-bg-color,#1a1a2e);color:var(--tg-theme-text-color,#fff);min-height:100vh;padding:16px}
.logo{text-align:center;font-size:28px;font-weight:900;margin:24px 0 4px}
.logo span{color:#fb542b}
.sub{text-align:center;opacity:.6;font-size:13px;margin-bottom:20px}
.searchbox{display:flex;gap:8px;position:sticky;top:0;padding:8px 0}
input{flex:1;padding:14px 16px;border-radius:14px;border:1px solid #333;background:var(--tg-theme-secondary-bg-color,#222);color:inherit;font-size:16px;outline:none}
input:focus{border-color:#fb542b}
button{background:#fb542b;color:#fff;border:none;border-radius:14px;padding:0 22px;font-size:16px;font-weight:700;cursor:pointer}
button:active{transform:scale(.95)}
#res{margin-top:12px;display:flex;flex-direction:column;gap:10px}
.card{background:var(--tg-theme-secondary-bg-color,#222);border-radius:14px;padding:12px 14px;text-decoration:none;color:inherit;display:block;cursor:pointer}
.card:active{transform:scale(.98)}
.card b{color:#7aa2ff;font-size:15px;display:block;margin-bottom:4px}
.card small{opacity:.65;font-size:12px;display:block;line-height:1.9}
.loading{text-align:center;opacity:.6;margin-top:20px}
</style>
</head>
<body>
<div class="logo">🦁 <span>Brave</span> سرچ</div>
<div class="sub">جستجو داخل تلگرام</div>
<div class="searchbox">
<input id="q" placeholder="چی رو سرچ کنم؟" enterkeyhint="search">
<button onclick="go()">🔍</button>
</div>
<button id="sendBtn" style="display:none;width:100%;padding:12px;margin-top:4px" onclick="sendToChat()">📩 نمایش لینک‌ها تو چت (باز شدن داخل تلگرام)</button>
<div id="res"></div>
<script>
const tg = window.Telegram.WebApp; tg.ready(); tg.expand();
const API = window.location.origin; // همون سرور خود ربات
let lastResults = [];
let lastQuery = "";
function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function openUrl(i){
  const u = lastResults[i].url;
  if (tg.openLink) tg.openLink(u, {try_instant_view:true});
  else window.open(u, '_blank');
}
function sendToChat(){
  const items = lastResults.slice(0,5).map(x=>({t:x.title, u:x.url}));
  tg.sendData(JSON.stringify({q:lastQuery, items}));
}
document.getElementById('q').addEventListener('keydown', e=>{ if(e.key==='Enter') go(); });
async function go(){
  const q = document.getElementById('q').value.trim();
  if(!q) return;
  const box = document.getElementById('res');
  box.innerHTML = '<div class="loading">در حال جستجو...</div>';
  try{
    const r = await fetch(API + '/api/search?q=' + encodeURIComponent(q));
    const d = await r.json();
    if(!d.results || !d.results.length){ box.innerHTML='<div class="loading">نتیجه‌ای پیدا نشد</div>'; return; }
    lastResults = d.results;
    lastQuery = q;
    document.getElementById('sendBtn').style.display = 'block';
    box.innerHTML = d.results.map((x,i)=>
      `<div class="card" onclick="openUrl(${i})"><b>${esc(x.title)}</b><small>${esc(x.desc)||''}<br>${esc(x.url)}</small></div>`
    ).join('');
  }catch(e){ box.innerHTML='<div class="loading">خطا در اتصال به سرور</div>'; }
}
</script>
</body>
</html>
